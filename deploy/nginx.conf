# Конфиг nginx для сайта «Мне 22 года и я не знаю, что делать дальше».
# Положите в /etc/nginx/sites-available/elita и включите симлинком в sites-enabled.
# Замените example.ru на свой домен, а /var/www/elita на путь к клону репозитория.
server {
    listen 80;
    listen [::]:80;
    server_name example.ru www.example.ru;

    root /var/www/elita;
    index index.html;

    # Отдаём только файлы сайта: служебные папки репозитория наружу не нужны
    location ~ ^/(\.git|tools|deploy)(/|$) { return 404; }
    location ~ /\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Шрифты ШИБЕЙС лежат в .ttf и .otf, которых нет в стандартном mime.types.
    # Блок types задан только здесь, иначе он заменил бы типы для всего сайта.
    location ~* \.(ttf|otf)$ {
        types {
            font/ttf ttf;
            font/otf otf;
        }
        expires 30d;
        add_header Cache-Control "public";
    }

    # Фото и скрипты меняются редко: кэшируем на неделю
    location ~* \.(jpg|jpeg|png|webp|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Страницу и данные не кэшируем, чтобы обновления были видны сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types application/javascript text/css application/json font/ttf font/otf image/svg+xml;
    gzip_min_length 1024;
}
